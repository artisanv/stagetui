# Release the 3D add-on (stagetui-3d) to PyPI on `3d-v*` tags.
# One wheel per platform: it holds the `stagetui-plugin-3d` program.
name: Release 3D add-on

on:
  push:
    tags:
      - '3d-v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform.runner }} ${{ matrix.platform.target }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: ubuntu-22.04, target: x86_64, manylinux: auto }
          - { runner: ubuntu-22.04-arm, target: aarch64, manylinux: auto }
          - { runner: macos-15-intel, target: x86_64 }
          - { runner: macos-latest, target: aarch64 }
          - { runner: windows-latest, target: x64 }
          - { runner: windows-11-arm, target: aarch64 }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/stagetui-3d
          target: ${{ matrix.platform.target }}
          args: --release --out ../../dist
          manylinux: ${{ matrix.platform.manylinux }}
      - uses: actions/upload-artifact@v6
        with:
          name: 3d-${{ matrix.platform.runner }}-${{ matrix.platform.target }}
          path: dist

  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: [build]
    permissions:
      id-token: write
      contents: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v7
      - uses: actions/attest@v4
        with:
          subject-path: '3d-*/*'
      - uses: astral-sh/setup-uv@v7
      - run: uv publish --trusted-publishing always '3d-*/*'
