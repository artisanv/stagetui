[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "stagetui-video"
dynamic = ["version"]
description = "The video add-on for stagetui: play video files and links in a pane, with sound."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
keywords = ["tui", "terminal", "video", "stagetui", "add-on"]
# ffmpeg comes with imageio-ffmpeg: no system install, no admin password.
dependencies = ["imageio-ffmpeg>=0.5"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Rust",
    "Topic :: Multimedia :: Video :: Display",
    "Topic :: Terminals",
]

[project.urls]
Homepage = "https://github.com/artisanv/stagetui"
Documentation = "https://github.com/artisanv/stagetui/blob/main/docs/plugins.md"

[tool.maturin]
bindings = "bin"
# Sound uses the system's own ALSA library (libasound.so.2, on every Linux
# desktop): a copy inside the wheel couldn't find the user's PipeWire/PulseAudio.
auditwheel = "skip"
