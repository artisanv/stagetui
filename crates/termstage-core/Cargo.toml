[package]
name = "termstage-core"
description = "The Rust engine behind termstage: terminal capabilities, rendering, sessions, headless snapshots, process reaper."
version.workspace = true
edition.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
crossterm = { workspace = true }
ratatui-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
unicode-width = { workspace = true }
unicode-bidi = { workspace = true }
unicode-segmentation = { workspace = true }
cosmic-text = { workspace = true }
resvg = { workspace = true }
tiny-skia = { workspace = true }
image = { workspace = true }
color_quant = { workspace = true }
taffy = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["termios", "event", "fs", "process", "shm", "stdio"] }
signal-hook = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
vt100 = "0.18"

[lints]
workspace = true
