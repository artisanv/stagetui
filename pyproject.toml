[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "stagetui"
dynamic = ["version"]
description = "A fun terminal UI library with Blender-like flexibility, friendly enough that newcomers enjoy the terminal: panes that show anything, real pictures, Arabic/RTL, sessions."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
keywords = ["tui", "terminal", "blender", "panes", "agents", "kitty", "sixel", "rtl", "arabic", "headless"]
# Zero runtime dependencies: everything lives in the Rust extension.
dependencies = []
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Free Threading :: 2 - Beta",
    "Programming Language :: Rust",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Terminals",
    "Typing :: Typed",
]

[project.optional-dependencies]
# Add-ons: `pip install "stagetui[video]"`.
video = ["stagetui-video>=0.1.0a2"]
web = ["stagetui-web>=0.1.0a4"]

[project.urls]
Homepage = "https://github.com/artisanv/stagetui"
Documentation = "https://github.com/artisanv/stagetui/blob/main/docs/README.md"
Source = "https://github.com/artisanv/stagetui"
Changelog = "https://github.com/artisanv/stagetui/blob/main/CHANGELOG.md"
Issues = "https://github.com/artisanv/stagetui/issues"

[project.scripts]
stagetui = "stagetui._core:cli_main"

[project.entry-points.pytest11]
stagetui = "stagetui.testing"

[dependency-groups]
dev = ["maturin>=1.9,<2", "pytest>=8"]

[tool.maturin]
manifest-path = "crates/stagetui-py/Cargo.toml"
python-source = "python"
module-name = "stagetui._core"
features = ["pyo3/extension-module"]
include = [{ path = "LICENSE-MIT", format = "sdist" }, { path = "LICENSE-APACHE", format = "sdist" }]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
# The specs are the owner's documents: never reformat them.
extend-exclude = ["termstage-SPEC-*.md"]

[tool.ruff.format]
# Docs keep hand-aligned comments for beginners; their code is run by tests/python/test_docs.py.
exclude = ["*.md"]

[tool.ruff.lint.per-file-ignores]
# Apps declare settings as class attributes (`BINDINGS = [...]`), like the docs teach.
"examples/**" = ["RUF012"]
"tests/**" = ["RUF012"]
