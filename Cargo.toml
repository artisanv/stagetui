[workspace]
resolver = "3"
members = [
    "crates/stagetui-core",
    "crates/stagetui-cli",
    "crates/stagetui-py",
    "crates/stagetui-plugin-api",
    "crates/stagetui-video",
    "crates/stagetui-web",
]
# The add-ons need system libraries to build (e.g. ALSA for sound): build them on purpose.
default-members = [
    "crates/stagetui-core",
    "crates/stagetui-cli",
    "crates/stagetui-py",
    "crates/stagetui-plugin-api",
]

[workspace.package]
version = "0.1.0-alpha.5"
edition = "2024"
license = "MIT OR Apache-2.0"
keywords = ["tui", "terminal", "kitty", "rtl", "agents"]
categories = ["command-line-interface"]

[workspace.dependencies]
stagetui-core = { path = "crates/stagetui-core", version = "0.1.0-alpha.5" }
stagetui-cli = { path = "crates/stagetui-cli", version = "0.1.0-alpha.5" }
stagetui-plugin-api = { path = "crates/stagetui-plugin-api", version = "0.1.0-alpha.5" }
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
ratatui-core = { version = "0.1", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"
unicode-bidi = "0.3"
unicode-segmentation = "1.13"
cosmic-text = "0.19"
resvg = "0.50"
tiny-skia = "0.12"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
color_quant = "2"
pulldown-cmark = { version = "0.13", default-features = false }
syntect = { version = "5.3", default-features = false, features = ["parsing", "default-syntaxes", "default-themes", "regex-fancy"] }
similar = "3.2"
portable-pty = "0.9"
vt100 = "0.18"
interprocess = "2.4"
taffy = { version = "0.16", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid", "content_size"] }

[workspace.lints.rust]
# Unsafe code is only allowed in `stagetui_core::os::*` (documented FFI).
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
