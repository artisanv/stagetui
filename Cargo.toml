[workspace]
resolver = "3"
members = ["crates/termstage-core", "crates/termstage-cli", "crates/termstage-py"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
keywords = ["tui", "terminal", "kitty", "rtl", "agents"]
categories = ["command-line-interface"]

[workspace.dependencies]
termstage-core = { path = "crates/termstage-core", version = "0.1.0" }
termstage-cli = { path = "crates/termstage-cli", version = "0.1.0" }
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
ratatui-core = { version = "0.1", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"
unicode-bidi = "0.3"
unicode-segmentation = "1.13"
cosmic-text = "0.19"
resvg = "0.50"
tiny-skia = "0.12"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
color_quant = "2"

[workspace.lints.rust]
# Unsafe code is only allowed in `termstage_core::os::*` (documented FFI).
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
